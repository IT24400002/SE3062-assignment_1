name: Pac-Man Autograder CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  autograder:
    name: Run Berkeley Pac-Man Autograder
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: 🚀 Run Autograder
        run: |
          if [ -f "autograder.py" ]; then
            python autograder.py
          elif [ -f "Group_Project/search/autograder.py" ]; then
            cd Group_Project/search && python autograder.py
          elif [ -f "search/autograder.py" ]; then
            cd search && python autograder.py
          fi

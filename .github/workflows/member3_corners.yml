name: Member 3 - Corners Problem (Q5)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test_m3:
    name: Test Corners Problem Representation (Q5)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install numpy matplotlib

      - name: 🧪 Run Q5 (Corners Problem Representation)
        run: |
          if [ -f "autograder.py" ]; then
            python autograder.py -q q5
          elif [ -f "Group_Project/search/autograder.py" ]; then
            cd Group_Project/search && python autograder.py -q q5
          fi
